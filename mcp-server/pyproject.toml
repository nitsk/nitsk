[project]
name = "revit-mcp"
version = "0.1.0"
description = "MCP server that lets Claude drive Autodesk Revit through the RevitMcpAddin bridge"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
revit-mcp = "revit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revit_mcp*"]
